<style>
  :root{--r:#e40303;--o:#ff8c00;--y:#ffed00;--g:#00a83a;--b:#2a6bff;--v:#9b2bc2;
    --rainbow:linear-gradient(90deg,var(--r),var(--o),var(--y),var(--g),var(--b),var(--v));
    --card:#17151f;--card2:#1e1b28;--line:#2a2733;--txt:#f3f1f7;--mut:#9a95a8}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  body{display:flex;flex-direction:column;height:100dvh}
  .flag{height:6px;background:var(--rainbow);flex:none}
  button{font:inherit;cursor:pointer}
  [hidden]{display:none!important}

  /* feed */
  .feed{flex:1;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain;position:relative}
  .feed::-webkit-scrollbar{display:none}
  .item{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:flex;justify-content:center;background:#000;overflow:hidden}
  .item .bg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(30px) brightness(.35);transform:scale(1.1)}
  .stage{position:relative;height:100%;width:100%;max-width:min(100%,calc((100dvh - 64px) * 9 / 16 + 120px));display:flex;align-items:center;justify-content:center}
  .stage video{width:100%;height:100%;object-fit:contain;background:transparent;display:block}
  .tapzone{position:absolute;inset:0;z-index:2}
  .playic{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:3;pointer-events:none;font-size:70px;opacity:0;transition:opacity .2s;text-shadow:0 2px 20px #000}
  .item.paused .playic{opacity:.85}
  .heart-pop{position:absolute;z-index:4;font-size:90px;pointer-events:none;animation:pop .8s ease-out forwards}
  @keyframes pop{0%{transform:translate(-50%,-50%) scale(.3) rotate(-15deg);opacity:0}25%{transform:translate(-50%,-50%) scale(1.2) rotate(0);opacity:1}100%{transform:translate(-50%,-90%) scale(1);opacity:0}}

  .side{position:absolute;right:10px;bottom:90px;z-index:5;display:flex;flex-direction:column;gap:16px;align-items:center}
  .av{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;color:#fff;position:relative}
  .av::after{content:"";position:absolute;inset:-3px;border-radius:50%;padding:2px;background:var(--rainbow);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
  .act{background:none;border:0;color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:13px;text-shadow:0 1px 6px #000}
  .act .ic{font-size:32px;line-height:1;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6));transition:transform .15s}
  .act:active .ic{transform:scale(.85)}
  .act.on .ic{animation:bate .35s}
  @keyframes bate{50%{transform:scale(1.35)}}
  .info{position:absolute;left:14px;right:80px;bottom:22px;z-index:5;text-shadow:0 1px 6px #000}
  .info .who{font-weight:900;font-size:16px}
  .info .cap{font-size:14px;margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:4.5em;overflow:hidden}
  .info .when{font-size:12px;color:#ccc;margin-top:4px}
  /* barra de progresso arrastável */
  .prog{position:absolute;left:0;right:0;bottom:0;height:22px;z-index:8;cursor:pointer;touch-action:none;display:flex;align-items:flex-end}
  .prog .trk{position:relative;width:100%;height:3px;background:rgba(255,255,255,.18);transition:height .15s}
  .prog .trk i{display:block;height:100%;width:0;background:var(--rainbow)}
  .prog .trk b{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;box-shadow:0 0 8px rgba(0,0,0,.6);opacity:0;transition:opacity .15s}
  .prog:hover .trk,.item.scrub .prog .trk{height:6px}
  .prog:hover .trk b,.item.scrub .prog .trk b{opacity:1}
  .tempo{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);z-index:9;font-size:30px;font-weight:900;text-shadow:0 2px 12px #000;pointer-events:none;opacity:0;transition:opacity .15s;white-space:nowrap}
  .tempo small{color:#bbb;font-size:22px}
  .item.scrub .tempo{opacity:1}
  .item.scrub .info,.item.scrub .side{opacity:.15}
  .vel{position:absolute;top:70px;left:50%;transform:translateX(-50%);z-index:9;background:rgba(0,0,0,.55);border-radius:999px;padding:6px 14px;font-weight:900;opacity:0;transition:opacity .15s;pointer-events:none}
  .item.rapido .vel{opacity:1}
  .info .cap{cursor:pointer}
  .info .cap.aberta{max-height:none}
  .info .som{font-size:13px;margin-top:6px;display:flex;gap:6px;align-items:center;overflow:hidden;white-space:nowrap;max-width:240px}
  .info .som span{display:inline-block;animation:letreiro 9s linear infinite;padding-left:100%}
  @keyframes letreiro{to{transform:translateX(-100%)}}
  .info .views{font-size:12px;color:#ddd;margin-top:2px}
  .disco{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle,#222 0 30%,#111 31% 100%);border:8px solid #1b1b1b;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:#fff;animation:gira 4s linear infinite;box-shadow:0 0 0 2px rgba(255,255,255,.15)}
  .item.paused .disco{animation-play-state:paused}
  @keyframes gira{to{transform:rotate(360deg)}}
  .av,.who{cursor:pointer}
  .abas{position:absolute;top:72px;left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:18px;font-weight:900;font-size:16px;text-shadow:0 1px 8px #000}
  .abas button{background:none;border:0;color:rgba(255,255,255,.6);padding:4px 0;position:relative}
  .abas button.on{color:#fff}
  .abas button.on::after{content:"";position:absolute;left:25%;right:25%;bottom:-3px;height:3px;border-radius:3px;background:var(--rainbow)}
  @media(max-width:520px){.abas{left:14px;transform:none;gap:14px;font-size:15px}}
  .grade{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
  .grade button{position:relative;aspect-ratio:9/16;border:0;padding:0;background:#000 center/cover;border-radius:4px;overflow:hidden}
  .grade button span{position:absolute;left:5px;bottom:4px;font-size:12px;font-weight:800;text-shadow:0 1px 4px #000;color:#fff}
  .perfil{display:flex;align-items:center;gap:14px;margin-bottom:14px}
  .perfil .av{width:64px;height:64px;font-size:26px}
  .perfil .nums{display:flex;gap:16px;font-size:13px;color:var(--mut)}
  .perfil .nums b{display:block;color:var(--txt);font-size:17px}

  .topbtns{position:absolute;top:70px;right:12px;z-index:20;display:flex;gap:8px}
  .rbtn{border:0;color:#fff;font-weight:900;border-radius:999px;padding:10px 16px;background:linear-gradient(90deg,var(--r),var(--o) 25%,var(--g) 55%,var(--b) 80%,var(--v));box-shadow:0 4px 18px rgba(0,0,0,.5)}
  /* volume: no PC a barrinha abre ao passar o mouse */
  .vol{display:flex;align-items:center;gap:0;border-radius:999px;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.25);transition:padding .2s}
  .vol .gbtn{border:0;background:none;backdrop-filter:none}
  .vol input{width:0;opacity:0;margin:0;transition:width .2s,opacity .2s,margin .2s;-webkit-appearance:none;appearance:none;height:6px;border-radius:6px;background:linear-gradient(90deg,#fff var(--p,80%),rgba(255,255,255,.25) var(--p,80%));cursor:pointer}
  .vol input::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 6px rgba(0,0,0,.5)}
  .vol input::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#fff}
  @media (pointer:fine){.vol:hover input,.vol:focus-within input{width:110px;opacity:1;margin:0 14px 0 2px}}
  .gbtn{border:1px solid rgba(255,255,255,.25);color:#fff;font-weight:800;border-radius:999px;padding:10px 14px;background:rgba(0,0,0,.45);backdrop-filter:blur(6px)}
  .empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:30px;color:var(--mut)}
  .empty h1{color:var(--txt);font-size:clamp(34px,7vw,56px);letter-spacing:-1px}
  .grad{background:var(--rainbow);-webkit-background-clip:text;background-clip:text;color:transparent}

  /* modais */
  .modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:var(--card);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:80dvh;display:flex;flex-direction:column;position:relative;overflow:hidden}
  .sheet::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--rainbow)}
  .sheet header{display:flex;align-items:center;padding:16px 18px 8px;font-weight:900}
  .sheet header button{margin-left:auto;background:none;border:0;color:var(--mut);font-size:22px}
  .sheet .body{padding:0 18px 18px;overflow-y:auto}
  label{display:block;font-size:13px;color:var(--mut);font-weight:700;margin:12px 0 6px}
  input,textarea{width:100%;background:#0d0c12;border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:12px 14px;font:inherit;font-size:15px;outline:none}
  textarea{min-height:70px;resize:vertical}
  .pick{display:flex;align-items:center;justify-content:center;gap:10px;border:2px dashed #3b3550;border-radius:14px;padding:22px;color:var(--mut);font-weight:700;cursor:pointer;text-align:center}
  .pick video{max-height:180px;border-radius:10px}
  .bar{height:8px;border-radius:99px;background:#0d0c12;overflow:hidden;margin-top:12px}
  .bar i{display:block;height:100%;width:0;background:var(--rainbow);transition:width .2s}
  .err{color:#ff6b6b;font-size:14px;min-height:20px;margin-top:8px}
  .mut{color:var(--mut);font-size:13px}
  .send{width:100%;margin-top:14px;border:0;border-radius:12px;padding:13px;font-weight:900;color:#fff;background:linear-gradient(90deg,var(--r),var(--o) 25%,var(--g) 55%,var(--b) 80%,var(--v))}
  .send:disabled{opacity:.5}
  .com{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
  .com:first-child{border-top:0}
  .com .av{width:34px;height:34px;font-size:14px;flex:none}
  .com b{font-size:13px}.com p{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
  .com.resp{margin-left:44px;padding-top:6px;border-top:0}
  .com.resp .av{width:26px;height:26px;font-size:11px}
  .com .corpo{flex:1;min-width:0}
  .com .acoes{display:flex;gap:14px;margin-top:4px;font-size:12px;color:var(--mut)}
  .com .acoes button{background:none;border:0;color:var(--mut);font:inherit;font-weight:800;cursor:pointer;padding:0}
  .com .acoes button:hover{color:var(--txt)}
  .com .clike{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--mut);cursor:pointer;align-self:flex-start;padding:2px 4px;font-size:18px}
  .com .clike small{font-size:11px;font-weight:800;min-height:13px}
  .cbox .canc{background:none!important;color:var(--mut)!important;padding:0 6px!important}
  .com .x{margin-left:auto;background:none;border:0;color:var(--mut);font-size:13px;align-self:flex-start}
  .cbox{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
  .cbox input{flex:1}
  .cbox button{border:0;border-radius:12px;padding:0 16px;font-weight:900;color:#fff;background:#2a2340}
  .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#24212d;border:1px solid var(--line);padding:10px 18px;border-radius:12px;font-size:14px;z-index:99}
  .menu{position:absolute;right:66px;bottom:150px;z-index:7;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .menu button{display:block;width:100%;background:none;border:0;color:var(--txt);padding:10px 16px;text-align:left;font-weight:700}
  .menu button:hover{background:var(--card2)}

/* ===== cores LGBT animadas (o arco-íris anda devagar em tudo que usa --rainbow) ===== */
@property --rbx{syntax:'<percentage>';inherits:true;initial-value:0%}
:root{--rainbow:repeating-linear-gradient(90deg,#e40303 calc(var(--rbx,0%) - 100%),#ff8c00 calc(var(--rbx,0%) - 83.33%),#ffed00 calc(var(--rbx,0%) - 66.67%),#00a83a calc(var(--rbx,0%) - 50%),#2a6bff calc(var(--rbx,0%) - 33.33%),#9b2bc2 calc(var(--rbx,0%) - 16.67%),#e40303 var(--rbx,0%));animation:rbx 9s steps(90) infinite}
@keyframes rbx{to{--rbx:100%}}
@media (prefers-reduced-motion:reduce){:root{animation:none}}
.rbtn,.send{background:var(--rainbow)}
</style>
</head>
<body>
<div class="flag"></div>
<!--SNAV: menu padrão de todas as páginas. NÃO editar aqui na página: edita scripts/nav.html e roda python3 scripts/aplicar-nav.py -->
<style>
@view-transition{navigation:auto}
::view-transition-old(root),::view-transition-new(root){animation-duration:.22s}
.sbar{position:sticky;top:0;z-index:70;flex:none;height:58px;display:flex;align-items:center;gap:10px;padding:0 14px;background:rgba(13,12,18,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid #2a2733;font:700 14.5px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#f3f1f7;box-sizing:border-box}
.sbar *,.sb-gaveta *{box-sizing:border-box;margin:0}
.sbar a,.sb-gaveta a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
.sbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--rainbow,linear-gradient(90deg,#e40303,#ff8c00,#ffed00,#00a83a,#2a6bff,#9b2bc2));opacity:.85}
.sb-logo{display:flex;align-items:center;height:42px;padding:0 8px;border-radius:12px;font-weight:900;font-size:23px;letter-spacing:-.4px;transition:transform .15s}
.sb-logo:hover{transform:scale(1.05)}
.sb-logo b{font-weight:900}
.sb-links{display:flex;gap:4px;margin-left:auto}
.sb-links a{display:flex;align-items:center;gap:7px;height:42px;padding:0 14px;border-radius:12px;color:#b5b0c4;white-space:nowrap;transition:background .15s,color .15s,transform .15s;position:relative}
.sb-links a .i{font-size:17px;line-height:1}
.sb-links a:hover{background:#1e1b28;color:#fff;transform:translateY(-1px)}
.sb-links a.on{background:#241f33;color:#fff;box-shadow:inset 0 0 0 1px #4d3d72}
.sb-links a.on::after{content:"";position:absolute;left:14px;right:14px;bottom:5px;height:3px;border-radius:3px;background:var(--rainbow,linear-gradient(90deg,#e40303,#ff8c00,#ffed00,#00a83a,#2a6bff,#9b2bc2))}
.sb-cur,.sb-btn{display:none}
.sb-gaveta{position:fixed;inset:58px 0 0 0;z-index:69;display:none}
.sb-gaveta .fundo{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .2s}
.sb-gaveta .grade{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px;background:#0f0e15;border-bottom:1px solid #2a2733;transform:translateY(-12px);opacity:0;transition:transform .22s,opacity .22s;font:700 15px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#f3f1f7}
.sb-gaveta .grade a{display:flex;flex-direction:column;gap:8px;padding:16px 14px;border-radius:16px;background:#17151f;border:1px solid #2a2733;min-height:84px;transition:background .15s}
.sb-gaveta .grade a .i{font-size:26px;line-height:1}
.sb-gaveta .grade a.on{background:#241f33;border-color:#6b4fa0}
.sb-gaveta .grade a:active{background:#241f33}
.sb-gaveta.aberta{display:block}
.sb-gaveta.mostra .fundo{opacity:1}
.sb-gaveta.mostra .grade{transform:none;opacity:1}
@media(max-width:940px){
  .sb-links{display:none}
  .sb-cur{display:flex;align-items:center;gap:7px;margin-left:4px;color:#b5b0c4;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sb-btn{display:flex;align-items:center;justify-content:center;gap:8px;margin-left:auto;height:42px;padding:0 14px;border-radius:12px;border:1px solid #2a2733;background:#17151f;color:#fff;font:800 14.5px/1 system-ui,sans-serif;cursor:pointer}
  .sb-btn .ham{width:18px;height:12px;position:relative}
  .sb-btn .ham i{position:absolute;left:0;right:0;height:2px;border-radius:2px;background:#fff;transition:transform .2s,opacity .2s}
  .sb-btn .ham i:nth-child(1){top:0}.sb-btn .ham i:nth-child(2){top:5px}.sb-btn .ham i:nth-child(3){top:10px}
  .sb-btn.x .ham i:nth-child(1){transform:translateY(5px) rotate(45deg)}
  .sb-btn.x .ham i:nth-child(2){opacity:0}
  .sb-btn.x .ham i:nth-child(3){transform:translateY(-5px) rotate(-45deg)}
}
@media(max-width:380px){.sb-cur{display:none}}
@media (prefers-reduced-motion:reduce){.sb-gaveta .grade,.sb-gaveta .fundo{transition:none}::view-transition-old(root),::view-transition-new(root){animation:none}}
</style>
<nav class="sbar" aria-label="Menu do Simas">
  <a class="sb-logo" href="/" aria-label="Simas, voltar pra home"><b style="color:#e40303">S</b><b style="color:#ff8c00">i</b><b style="color:#ffed00">m</b><b style="color:#00c13a">a</b><b style="color:#2a6bff">s</b></a>
  <span class="sb-cur" id="sbCur"></span>
  <div class="sb-links" id="sbLinks">
    <a href="/"><span class="i">🏠</span>Home</a>
    <a href="/simastelas/"><span class="i">📺</span>SimasTelas</a>
    <a href="/simastok/"><span class="i">🎬</span>SimasTok</a>
    <a href="/jogos/"><span class="i">🎮</span>Jogos</a>
    <a href="/simasfitness/"><span class="i">💪</span>Fitness</a>
    <a href="/conversimas/"><span class="i">🔄</span>ConverSimas</a>
    <a href="/sugestoes/"><span class="i">💡</span>Sugestões</a>
  </div>
  <button class="sb-btn" id="sbBtn" aria-expanded="false" aria-controls="sbGaveta"><span class="ham"><i></i><i></i><i></i></span>menu</button>
</nav>
<div class="sb-gaveta" id="sbGaveta"><div class="fundo"></div><div class="grade" id="sbGrade"></div></div>
<script>
(() => {
  const links = [...document.querySelectorAll('#sbLinks a')], p = location.pathname.replace(/^\/v\//, '/simastok/');
  let atual = null;
  for (const a of links) { const h = a.getAttribute('href'); if (h === '/' ? p === '/' : p.startsWith(h)) { a.classList.add('on'); atual = a; } }
  if (atual) document.getElementById('sbCur').innerHTML = atual.innerHTML;
  const grade = document.getElementById('sbGrade');
  for (const a of links) { const c = a.cloneNode(true); grade.appendChild(c); }
  const gav = document.getElementById('sbGaveta'), btn = document.getElementById('sbBtn');
  const abre = sim => {
    btn.classList.toggle('x', sim); btn.setAttribute('aria-expanded', sim);
    if (sim) { gav.classList.add('aberta'); requestAnimationFrame(() => requestAnimationFrame(() => gav.classList.add('mostra'))); }
    else { gav.classList.remove('mostra'); setTimeout(() => { if (!gav.classList.contains('mostra')) gav.classList.remove('aberta'); }, 230); }
  };
  btn.onclick = () => abre(!gav.classList.contains('aberta'));
  gav.querySelector('.fundo').onclick = () => abre(false);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') abre(false); });
  // carrega a página antes do clique (navegação mais rápida)
  const feitos = new Set();
  const pre = e => { const a = e.target.closest && e.target.closest('a[href^="/"]'); if (!a || feitos.has(a.href)) return; feitos.add(a.href); const l = document.createElement('link'); l.rel = 'prefetch'; l.href = a.href; document.head.appendChild(l); };
  document.querySelectorAll('.sbar, .sb-gaveta').forEach(el => { el.addEventListener('pointerenter', pre, true); el.addEventListener('touchstart', pre, { passive: true, capture: true }); });
})();
</script>

<script>
/* ===== Cloudinary (onde os vídeos ficam) ===== */
const CLOUD = 'k4mjzxdz';    // nome da nuvem (cloud name)
const PRESET = 'nv5gv6px';   // upload preset "Unsigned"

const firebaseConfig = {
  apiKey: "AIzaSyA0G_qSK5eEVzGnLskGS8leXCwC7XNzK0A",
  authDomain: "simasfitness2.firebaseapp.com",
  projectId: "simasfitness2",
  storageBucket: "simasfitness2.firebasestorage.app",
  messagingSenderId: "1068623437415",
  appId: "1:1068623437415:web:63ccdb065e991452563ec2"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth(), db = firebase.firestore(), FV = firebase.firestore.FieldValue;
const $ = id => document.getElementById(id);
const COLORS = ['#e40303','#ff8c00','#c99a00','#00a83a','#2a6bff','#9b2bc2','#e0457b','#1aa3a3'];
const colorOf = s => { let h = 0; for (const ch of s || '?') h = (h * 31 + ch.charCodeAt(0)) >>> 0; return COLORS[h % COLORS.length]; };
const avatar = (nome, cls = 'av') => { const a = document.createElement('div'); a.className = cls; a.style.background = colorOf(nome); a.textContent = ([...(nome || '?')][0] || '?').toUpperCase(); return a; };
const toast = t => { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2200); };
const quando = ts => { if (!ts || !ts.toDate) return 'agora'; const s = (Date.now() - ts.toDate()) / 1000; if (s < 60) return 'agora'; if (s < 3600) return Math.floor(s / 60) + ' min'; if (s < 86400) return Math.floor(s / 3600) + ' h'; return ts.toDate().toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }); };
const vurl = v => `https://res.cloudinary.com/${v.cloud}/video/upload/q_auto,vc_auto,w_720,c_limit/${v.pid}.mp4`;
// vídeo pra baixar: o vídeo + o final do SimasTok colado no fim (igual o tiktok faz). O Cloudinary monta sozinho na 1ª vez que pedem.
const OUTRO = 'simastok:outro-simastok';
const outroUrl = v => `https://res.cloudinary.com/${v.cloud}/video/upload/w_720,h_1280,c_pad,b_black/l_video:${OUTRO},w_720,h_1280,c_pad,b_black,fl_splice/fl_layer_apply/q_auto,vc_h264,fl_attachment/${v.pid}.mp4`;
const aquece = v => { try { fetch(outroUrl(v)).then(r => r.body && r.body.cancel()).catch(() => {}); } catch (e) {} };
const duracao = src => new Promise(res => { const x = document.createElement('video'); x.preload = 'metadata'; x.muted = true; const t = setTimeout(() => res(0), 15000); x.onloadedmetadata = () => { clearTimeout(t); res(x.duration || 0); }; x.onerror = () => { clearTimeout(t); res(0); }; x.src = src + (src.includes('?') ? '&' : '?') + 'c=' + Date.now(); });
async function baixarComFinal(v) {
  const url = outroUrl(v), precisa = (v.dur || 0) + 2.5;
  toast('preparando o video com o final do SimasTok…');
  for (let i = 0; i < 20; i++) {
    const d = await duracao(url);
    if (d >= Math.max(3, precisa - 1)) { const a = document.createElement('a'); a.href = url; a.download = ''; document.body.appendChild(a); a.click(); a.remove(); toast('baixando ⬇️'); return; }
    await new Promise(r => setTimeout(r, 4000));
  }
  toast('demorou demais pra montar, tenta de novo daqui a pouco');
}
const purl = v => `https://res.cloudinary.com/${v.cloud}/video/upload/so_0,w_480,c_limit/${v.pid}.jpg`;

let uid = null, admin = false, aprovadores = [], vids = [], items = new Map(), atual = null;
let mudo = true; try { mudo = localStorage.getItem('simastok-som') !== '1'; } catch (e) {}
let volume = 0.8; try { const vv = parseFloat(localStorage.getItem('simastok-vol')); if (vv >= 0 && vv <= 1) volume = vv; } catch (e) {}
const updMute = () => {
  $('muteBtn').textContent = mudo || volume === 0 ? '🔇' : volume < 0.5 ? '🔉' : '🔊';
  $('volR').value = Math.round((mudo ? 0 : volume) * 100); $('volR').style.setProperty('--p', (mudo ? 0 : volume * 100) + '%');
  for (const it of items.values()) { it.video.muted = mudo; it.video.volume = volume; }
};
$('volR').addEventListener('input', () => {
  volume = $('volR').value / 100; try { localStorage.setItem('simastok-vol', volume); } catch (e) {}
  const m = volume === 0; if (m !== mudo) { mudo = m; try { localStorage.setItem('simastok-som', mudo ? '0' : '1'); } catch (e) {} }
  updMute(); if (atual && !mudo) atual.video.play().catch(() => {});
});
// rodinha do mouse em cima do som muda o volume
$('vol').addEventListener('wheel', e => { e.preventDefault(); e.stopPropagation(); volume = Math.min(1, Math.max(0, volume + (e.deltaY < 0 ? 0.05 : -0.05))); mudo = volume === 0; try { localStorage.setItem('simastok-vol', volume); } catch (er) {} updMute(); }, { passive: false });
$('muteBtn').onclick = () => { mudo = !mudo; try { localStorage.setItem('simastok-som', mudo ? '0' : '1'); } catch (e) {} updMute(); if (atual) atual.video.play().catch(() => {}); };
updMute();
// navegador não deixa começar com som; no primeiro toque na tela o som liga sozinho (se a pessoa não tiver mutado de propósito)
let mutouDeProposito = false; try { mutouDeProposito = localStorage.getItem('simastok-som') === '0'; } catch (e) {}
// teclado de PC com tecla de volume: aumentou o volume, liga o som (no celular o navegador não avisa o site)
document.addEventListener('keydown', e => {
  if (e.key === 'AudioVolumeUp' && mudo) { mudo = false; try { localStorage.setItem('simastok-som', '1'); } catch (er) {} updMute(); if (atual) atual.video.play().catch(() => {}); }
  if (e.key === 'AudioVolumeMute') { mudo = !mudo; updMute(); }
});
document.addEventListener('pointerdown', function primeiro(e) {
  document.removeEventListener('pointerdown', primeiro, true);
  if (mudo && !mutouDeProposito && !e.target.closest('#muteBtn')) { mudo = false; updMute(); if (atual) atual.video.play().catch(() => {}); }
}, true);

auth.onAuthStateChanged(async u => {
  if (!u) { try { await auth.signInAnonymously(); } catch (e) { $('empty').textContent = 'deu pau pra conectar, recarrega a pagina'; } return; }
  uid = u.uid;
  admin = await db.doc('segredo/sugestoes').get().then(() => true).catch(() => false);
  db.doc('config/sugestoes').onSnapshot(d => { aprovadores = (d.exists && d.data().aprovadores) || []; }, () => {});
  db.collection('tok').orderBy('t', 'desc').limit(100).onSnapshot(q => {
    vids = q.docs.map(d => Object.assign({ id: d.id }, d.data()));
    render();
  }, e => { $('empty').textContent = 'nao deu pra carregar os video'; });
});
const podeApagar = v => admin || aprovadores.includes(uid) || v.autor === uid;

/* ===== feed ===== */
const io = new IntersectionObserver(es => {
  for (const e of es) {
    const it = items.get(e.target.dataset.id); if (!it) continue;
    if (e.isIntersecting && e.intersectionRatio > 0.6) ativar(it);
  }
}, { root: $('feed'), threshold: [0, 0.6, 1] });

let ordem = 'novos';
document.querySelectorAll('#abas button').forEach(bt => bt.onclick = () => {
  ordem = bt.dataset.o; document.querySelectorAll('#abas button').forEach(x => x.classList.toggle('on', x === bt));
  render(); $('feed').scrollTo({ top: 0 });
});
const ordenados = () => ordem === 'alta'
  ? [...vids].sort((a, b) => ((b.likes || []).length * 3 + (b.views || 0)) - ((a.likes || []).length * 3 + (a.views || 0)))
  : vids;
function render() {
  const feed = $('feed');
  if (!vids.length) {
    feed.innerHTML = '';
    const e = document.createElement('div'); e.className = 'empty'; e.id = 'empty';
    e.innerHTML = '<h1><span class="grad">SimasTok</span></h1><div>ninguem postou porra nenhuma ainda.<br>seja o primeiro a passar vergonha</div>';
    if (CLOUD) { const b = document.createElement('button'); b.className = 'rbtn'; b.textContent = '＋ postar'; b.onclick = abrirUp; e.appendChild(b); }
    else { const m = document.createElement('div'); m.className = 'mut'; m.textContent = '(o upload ainda ta sendo ligado)'; e.appendChild(m); }
    feed.appendChild(e); items.clear(); atual = null; return;
  }
  $('empty') && $('empty').remove();
  const ids = new Set(vids.map(v => v.id));
  for (const [id, it] of items) if (!ids.has(id)) { io.unobserve(it.el); it.el.remove(); items.delete(id); if (atual === it) atual = null; }
  ordenados().forEach((v, i) => {
    let it = items.get(v.id);
    if (!it) { it = criar(v); items.set(v.id, it); io.observe(it.el); }
    it.v = v; atualizar(it);
    if (feed.children[i] !== it.el) feed.insertBefore(it.el, feed.children[i] || null);
  });
  if (!render.foi) { render.foi = true; const alvo = (location.pathname.match(/^\/v\/([A-Za-z0-9]+)/) || [])[1] || new URLSearchParams(location.search).get('v'); if (alvo && items.get(alvo)) items.get(alvo).el.scrollIntoView(); }
  carregarPerto();
}

function criar(v) {
  const el = document.createElement('section'); el.className = 'item'; el.dataset.id = v.id;
  const bg = document.createElement('div'); bg.className = 'bg'; bg.style.backgroundImage = `url("${purl(v)}")`;
  const stage = document.createElement('div'); stage.className = 'stage';
  const video = document.createElement('video'); video.loop = true; video.playsInline = true; video.muted = mudo; video.preload = 'none'; video.poster = purl(v);
  video.volume = volume; video.setAttribute('playsinline', ''); video.setAttribute('webkit-playsinline', '');
  const tap = document.createElement('div'); tap.className = 'tapzone';
  const pic = document.createElement('div'); pic.className = 'playic'; pic.textContent = '▶';
  stage.append(video, tap, pic);
  const side = document.createElement('div'); side.className = 'side';
  const av = avatar(v.nome);
  const like = document.createElement('button'); like.className = 'act'; like.innerHTML = '<span class="ic">🤍</span><span class="n">0</span>';
  const com = document.createElement('button'); com.className = 'act'; com.innerHTML = '<span class="ic">💬</span><span class="n">💬</span>';
  const share = document.createElement('button'); share.className = 'act'; share.innerHTML = '<span class="ic">↗️</span><span>link</span>';
  const salva = document.createElement('button'); salva.className = 'act'; salva.innerHTML = '<span class="ic">🔖</span><span class="n">0</span>';
  const mais = document.createElement('button'); mais.className = 'act'; mais.innerHTML = '<span class="ic">⋯</span>';
  const disco = document.createElement('div'); disco.className = 'disco'; disco.textContent = ([...(v.nome || '?')][0] || '?').toUpperCase();
  side.append(av, like, com, salva, share, mais, disco);
  const info = document.createElement('div'); info.className = 'info';
  const who = document.createElement('div'); who.className = 'who';
  const cap = document.createElement('div'); cap.className = 'cap';
  const when = document.createElement('div'); when.className = 'when';
  const views = document.createElement('div'); views.className = 'views';
  const som = document.createElement('div'); som.className = 'som'; som.innerHTML = '♫ <span></span>';
  info.append(who, cap, som, views, when);
  cap.onclick = () => cap.classList.toggle('aberta');
  const prog = document.createElement('div'); prog.className = 'prog'; prog.innerHTML = '<div class="trk"><i></i><b></b></div>';
  const tempo = document.createElement('div'); tempo.className = 'tempo';
  const vel = document.createElement('div'); vel.className = 'vel'; vel.textContent = '2x ⏩';
  el.append(bg, stage, side, info, prog, tempo, vel);
  const it = { el, video, like, com, salva, who, cap, when, views, som: som.querySelector('span'), prog: prog.querySelector('i'), bola: prog.querySelector('b'), v };
  av.onclick = () => abrirPerfil(it.v.nome); who.onclick = () => abrirPerfil(it.v.nome);
  salva.onclick = () => salvar(it);

  // barra arrastável: segura e arrasta pra voltar/avançar
  const fmt = t => { t = Math.max(0, Math.floor(t || 0)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
  let arrastando = false, tocavaAntes = false;
  const posPara = e => { const r = prog.getBoundingClientRect(); return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); };
  const mostra = f => { const d = video.duration || 0; it.prog.style.width = (f * 100) + '%'; it.bola.style.left = (f * 100) + '%'; tempo.innerHTML = fmt(f * d) + ' <small>/ ' + fmt(d) + '</small>'; };
  prog.addEventListener('pointerdown', e => {
    if (!video.duration) return;
    arrastando = true; tocavaAntes = !video.paused; video.pause(); el.classList.add('scrub');
    prog.setPointerCapture(e.pointerId); const f = posPara(e); mostra(f); video.currentTime = f * video.duration; e.preventDefault(); e.stopPropagation();
  });
  prog.addEventListener('pointermove', e => { if (!arrastando) return; const f = posPara(e); mostra(f); video.currentTime = f * video.duration; });
  const solta = () => { if (!arrastando) return; arrastando = false; el.classList.remove('scrub'); if (tocavaAntes) { video.play().catch(() => {}); el.classList.remove('paused'); } };
  prog.addEventListener('pointerup', solta); prog.addEventListener('pointercancel', solta);

  // segurar o dedo/mouse no vídeo = 2x (igual tiktok)
  let segT = null, rapido = false;
  tap.addEventListener('pointerdown', () => { segT = setTimeout(() => { rapido = true; video.playbackRate = 2; el.classList.add('rapido'); if (video.paused) { video.play().catch(() => {}); el.classList.remove('paused'); } }, 450); });
  const fimSeg = () => { clearTimeout(segT); if (rapido) { video.playbackRate = 1; el.classList.remove('rapido'); setTimeout(() => { rapido = false; }, 50); } };
  tap.addEventListener('pointerup', fimSeg); tap.addEventListener('pointercancel', fimSeg); tap.addEventListener('pointerleave', fimSeg);
  tap.addEventListener('contextmenu', e => e.preventDefault());

  // conta visualização depois de 2s assistindo (uma vez por vídeo nesta aba)
  video.addEventListener('timeupdate', () => {
    if (!it.contou && video.currentTime > 2) { it.contou = true; db.doc('tok/' + it.v.id).update({ views: (it.v.views || 0) + 1 }).catch(() => {}); }
  });

  let lastTap = 0, tapT = null;
  tap.addEventListener('click', ev => {
    if (rapido) return;
    const now = Date.now();
    if (now - lastTap < 300) { clearTimeout(tapT); lastTap = 0; curtir(it, true); coracao(ev, stage); return; }
    lastTap = now;
    tapT = setTimeout(() => { if (video.paused) { video.play().catch(() => {}); el.classList.remove('paused'); } else { video.pause(); el.classList.add('paused'); } }, 280);
  });
  like.onclick = () => curtir(it);
  com.onclick = () => abrirCom(it.v);
  share.onclick = () => { const url = location.origin + '/v/' + it.v.id + '/'; (navigator.share ? navigator.share({ url, title: 'SimasTok' }) : navigator.clipboard.writeText(url).then(() => toast('link copiado'))).catch(() => {}); };
  mais.onclick = () => {
    const old = el.querySelector('.menu'); if (old) { old.remove(); return; }
    const m = document.createElement('div'); m.className = 'menu';
    const b1 = document.createElement('button'); b1.textContent = '⬇️ baixar'; b1.onclick = () => { m.remove(); baixarComFinal(it.v); };
    m.appendChild(b1);
    if (podeApagar(it.v)) { const b2 = document.createElement('button'); b2.textContent = '🗑️ apagar'; b2.onclick = () => { m.remove(); if (confirm('apagar esse video?')) db.doc('tok/' + it.v.id).delete().then(() => toast('apagado')).catch(() => toast('sem permissao')); }; m.appendChild(b2); }
    el.appendChild(m); setTimeout(() => document.addEventListener('click', function f(e) { if (!m.contains(e.target)) { m.remove(); document.removeEventListener('click', f); } }), 0);
  };
  video.addEventListener('timeupdate', () => { if (video.duration && !arrastando) { const f = video.currentTime / video.duration; it.prog.style.width = (f * 100) + '%'; it.bola.style.left = (f * 100) + '%'; } });
  return it;
}

function atualizar(it) {
  const v = it.v, likes = v.likes || [], meu = likes.includes(uid);
  it.like.querySelector('.ic').textContent = meu ? '❤️' : '🤍';
  it.like.querySelector('.n').textContent = likes.length;
  it.com.querySelector('.n').textContent = v.coms || 0;
  it.who.textContent = '@' + (v.nome || '?');
  it.cap.textContent = v.legenda || '';
  it.when.textContent = quando(v.t);
  const sv = v.salvos || [];
  it.salva.querySelector('.ic').textContent = sv.includes(uid) ? '📌' : '🔖';
  it.salva.querySelector('.n').textContent = sv.length;
  it.views.textContent = '▶ ' + (v.views || 0) + ' visualizaç' + ((v.views || 0) === 1 ? 'ão' : 'ões');
  it.som.textContent = 'som original - @' + (v.nome || '?');
}
function salvar(it) {
  const meu = (it.v.salvos || []).includes(uid);
  it.salva.classList.remove('on'); void it.salva.offsetWidth; it.salva.classList.add('on');
  db.doc('tok/' + it.v.id).update({ salvos: meu ? FV.arrayRemove(uid) : FV.arrayUnion(uid) }).then(() => toast(meu ? 'tirado dos salvos' : 'salvo 📌')).catch(() => toast('nao deu pra salvar'));
}
// perfil: todos os vídeos da pessoa em grade
function abrirPerfil(nome) {
  const dele = vids.filter(x => (x.nome || '') === nome);
  const curt = dele.reduce((s, x) => s + (x.likes || []).length, 0), vis = dele.reduce((s, x) => s + (x.views || 0), 0);
  $('pfTitulo').textContent = '@' + nome;
  const b = $('pfBody'); b.innerHTML = '';
  const topo = document.createElement('div'); topo.className = 'perfil';
  const nums = document.createElement('div'); nums.className = 'nums';
  nums.innerHTML = `<div><b>${dele.length}</b>videos</div><div><b>${curt}</b>curtidas</div><div><b>${vis}</b>views</div>`;
  topo.append(avatar(nome), nums); b.appendChild(topo);
  const g = document.createElement('div'); g.className = 'grade';
  for (const x of dele) {
    const bt = document.createElement('button'); bt.style.backgroundImage = `url("${purl(x)}")`;
    const sp = document.createElement('span'); sp.textContent = '▶ ' + (x.views || 0); bt.appendChild(sp);
    bt.onclick = () => { $('mPerfil').hidden = true; const t = items.get(x.id); if (t) t.el.scrollIntoView({ behavior: 'smooth' }); };
    g.appendChild(bt);
  }
  b.appendChild(g); $('mPerfil').hidden = false;
}

function curtir(it, soLike) {
  const meu = (it.v.likes || []).includes(uid);
  if (meu && soLike) return;
  it.like.classList.remove('on'); void it.like.offsetWidth; it.like.classList.add('on');
  db.doc('tok/' + it.v.id).update({ likes: meu ? FV.arrayRemove(uid) : FV.arrayUnion(uid) }).catch(() => toast('nao deu pra curtir'));
}
function coracao(ev, stage) {
  const r = stage.getBoundingClientRect(), h = document.createElement('div'); h.className = 'heart-pop';
  h.textContent = ['❤️','🏳️‍🌈','💖','🔥'][Math.floor(Math.random() * 4)];
  h.style.left = (ev.clientX - r.left) + 'px'; h.style.top = (ev.clientY - r.top) + 'px';
  stage.appendChild(h); setTimeout(() => h.remove(), 850);
}

function ativar(it) {
  if (atual === it) return;
  if (atual) { atual.video.pause(); }
  atual = it; it.el.classList.remove('paused');
  if (!it.video.src) it.video.src = vurl(it.v);
  it.video.muted = mudo; it.video.currentTime = 0;
  it.video.play().catch(() => { it.video.muted = true; mudo = true; updMute(); it.video.play().catch(() => it.el.classList.add('paused')); });
  carregarPerto();
  aquece(it.v);   // já deixa o vídeo com final pronto caso alguém baixe
  history.replaceState(null, '', '/v/' + it.v.id + '/');
}
// só baixa o vídeo atual e o próximo (economiza internet e a cota grátis)
function carregarPerto() {
  const lista = [...$('feed').children].filter(e => e.dataset.id);
  const i = atual ? lista.indexOf(atual.el) : 0;
  lista.forEach((el, k) => {
    const it = items.get(el.dataset.id); if (!it) return;
    if (k === i + 1 && !it.video.src) { it.video.preload = 'auto'; it.video.src = vurl(it.v); }
    if (Math.abs(k - i) > 2 && it.video.src) { it.video.pause(); it.video.removeAttribute('src'); it.video.load(); }
  });
}
document.addEventListener('visibilitychange', () => { if (document.hidden && atual) atual.video.pause(); else if (atual && !atual.el.classList.contains('paused')) atual.video.play().catch(() => {}); });
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea')) return;
  const f = $('feed');
  if (e.key === 'ArrowDown' || e.key === 'j') { f.scrollBy({ top: f.clientHeight, behavior: 'smooth' }); e.preventDefault(); }
  if (e.key === 'ArrowUp' || e.key === 'k') { f.scrollBy({ top: -f.clientHeight, behavior: 'smooth' }); e.preventDefault(); }
  if (e.key === 'm') $('muteBtn').click();
  if (e.key === ' ' && atual) { atual.el.querySelector('.tapzone').click(); e.preventDefault(); }
});

/* ===== modais ===== */
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => b.closest('.modal').hidden = true);
document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => { if (e.target === m) m.hidden = true; }));
try { $('nick').value = localStorage.getItem('simas-nick') || localStorage.getItem('simastelas-nick') || ''; } catch (e) {}

/* ===== postar ===== */
let arquivo = null;
function abrirUp() {
  if (!CLOUD || !PRESET) { toast('o upload ainda ta sendo ligado, segura ai'); return; }
  $('mUp').hidden = false;
}
$('upBtn').onclick = abrirUp;
$('file').onchange = () => {
  const f = $('file').files[0]; arquivo = null; $('upErr').textContent = '';
  if (!f) return;
  if (!/^video\//.test(f.type)) { $('upErr').textContent = 'isso ai nao é video nao'; return; }
  if (f.size > 100 * 1024 * 1024) { $('upErr').textContent = 'video muito grande (max 100 MB). corta ele ai'; return; }
  arquivo = f;
  const pk = $('pickTxt'); pk.innerHTML = ''; const pv = document.createElement('video'); pv.src = URL.createObjectURL(f); pv.muted = true; pv.autoplay = true; pv.loop = true; pv.playsInline = true; pk.appendChild(pv);
};
$('sendBtn').onclick = () => {
  const nome = $('nick').value.trim(), legenda = $('cap').value.trim();
  $('upErr').textContent = '';
  if (!arquivo) { $('upErr').textContent = 'escolhe o video primeiro porra'; return; }
  if (!nome) { $('upErr').textContent = 'bota teu nick'; return; }
  try { localStorage.setItem('simas-nick', nome); } catch (e) {}
  const fd = new FormData(); fd.append('file', arquivo); fd.append('upload_preset', PRESET); fd.append('folder', 'simastok');
  const xhr = new XMLHttpRequest(); xhr.open('POST', `https://api.cloudinary.com/v1_1/${CLOUD}/video/upload`);
  $('bar').hidden = false; $('sendBtn').disabled = true; $('sendBtn').textContent = 'subindo…';
  xhr.upload.onprogress = e => { if (e.lengthComputable) $('bar').firstChild.style.width = (e.loaded / e.total * 100) + '%'; };
  const fim = msg => { $('sendBtn').disabled = false; $('sendBtn').textContent = 'postar'; if (msg) $('upErr').textContent = msg; };
  xhr.onerror = () => fim('caiu a internet no meio, tenta de novo');
  xhr.onload = async () => {
    let r = {}; try { r = JSON.parse(xhr.responseText); } catch (e) {}
    if (xhr.status !== 200 || !r.public_id) { fim('o upload deu ruim: ' + ((r.error && r.error.message) || xhr.status)); return; }
    try {
      aquece({ cloud: CLOUD, pid: r.public_id });
      await db.collection('tok').add({ autor: uid, nome, legenda, cloud: CLOUD, pid: r.public_id, dur: Math.round(r.duration || 0), w: r.width || 0, h: r.height || 0, likes: [], coms: 0, t: FV.serverTimestamp() });
      $('mUp').hidden = true; $('cap').value = ''; $('file').value = ''; arquivo = null; $('pickTxt').textContent = '📹 escolhe o video (ate 100 MB)'; $('bar').hidden = true; $('bar').firstChild.style.width = '0';
      fim(); toast('postado 🔥'); $('feed').scrollTo({ top: 0 });
    } catch (e) { fim('subiu mas nao salvou: ' + (e.code || e.message)); }
  };
  xhr.send(fd);
};

/* ===== comentários ===== */
let comVid = null, comUnsub = null, respondendo = null;
const cancelaResp = () => { respondendo = null; $('comTxt').placeholder = 'comenta ai…'; $('cancResp').hidden = true; };
function abrirCom(v) {
  comVid = v; $('mCom').hidden = false; $('comList').innerHTML = '<p class="mut">carregando…</p>';
  if (comUnsub) comUnsub();
  comUnsub = db.collection('tokcom').where('vid', '==', v.id).limit(200).onSnapshot(q => {
    const l = q.docs.map(d => Object.assign({ id: d.id }, d.data())).sort((a, b) => ((a.t && a.t.toMillis()) || 9e15) - ((b.t && b.t.toMillis()) || 9e15));
    $('comTitle').textContent = l.length + ' comentario' + (l.length === 1 ? '' : 's');
    const box = $('comList'); box.innerHTML = '';
    if (!l.length) box.innerHTML = '<p class="mut">ninguem comentou ainda. comenta ai porra</p>';
    // comentário + respostas embaixo dele
    const ids = new Set(l.map(c => c.id));
    const raiz = l.filter(c => !c.pai || !ids.has(c.pai));
    const filhos = {}; for (const c of l) if (c.pai && ids.has(c.pai)) (filhos[c.pai] = filhos[c.pai] || []).push(c);
    const linha = (c, resp) => {
      const row = document.createElement('div'); row.className = 'com' + (resp ? ' resp' : '');
      const d = document.createElement('div'); d.className = 'corpo';
      const b = document.createElement('b'); b.textContent = c.nome;
      const p = document.createElement('p'); p.textContent = c.texto;
      const acoes = document.createElement('div'); acoes.className = 'acoes';
      const quando_ = document.createElement('span'); quando_.textContent = quando(c.t);
      const rb = document.createElement('button'); rb.textContent = 'responder';
      rb.onclick = () => { respondendo = { id: c.pai && ids.has(c.pai) ? c.pai : c.id, nome: c.nome }; $('comTxt').placeholder = 'respondendo @' + c.nome + '…'; $('comTxt').value = '@' + c.nome + ' '; $('comTxt').focus(); $('cancResp').hidden = false; };
      acoes.append(quando_, rb);
      if (admin || aprovadores.includes(uid) || c.autor === uid) { const x = document.createElement('button'); x.textContent = 'apagar'; x.onclick = () => { if (confirm('apagar esse comentario?')) db.doc('tokcom/' + c.id).delete().then(() => db.doc('tok/' + comVid.id).update({ coms: FV.increment(-1) }).catch(() => {})); }; acoes.appendChild(x); }
      d.append(b, p, acoes);
      const lk = c.likes || [], meu = lk.includes(uid);
      const cor = document.createElement('button'); cor.className = 'clike' + (meu ? ' on' : ''); cor.innerHTML = `<span>${meu ? '❤️' : '🤍'}</span><small>${lk.length || ''}</small>`;
      cor.onclick = () => db.doc('tokcom/' + c.id).update({ likes: meu ? FV.arrayRemove(uid) : FV.arrayUnion(uid) }).catch(() => toast('nao deu pra curtir'));
      row.append(avatar(c.nome), d, cor);
      return row;
    };
    for (const c of raiz) {
      box.appendChild(linha(c, false));
      for (const r of (filhos[c.id] || [])) box.appendChild(linha(r, true));
    }
    box.scrollTop = box.scrollHeight;
  }, () => { $('comList').innerHTML = '<p class="mut">nao deu pra carregar</p>'; });
}
$('mCom').addEventListener('click', e => { if (e.target === $('mCom') || e.target.closest('[data-close]')) { if (comUnsub) { comUnsub(); comUnsub = null; } } });
const mandarCom = async () => {
  const texto = $('comTxt').value.trim(); if (!texto || !comVid) return;
  let nome = ''; try { nome = localStorage.getItem('simas-nick') || ''; } catch (e) {}
  if (!nome) { nome = (prompt('qual teu nick?') || '').trim().slice(0, 30); if (!nome) return; try { localStorage.setItem('simas-nick', nome); } catch (e) {} }
  $('comTxt').value = '';
  try {
    const doc = { vid: comVid.id, autor: uid, nome, texto, t: FV.serverTimestamp(), likes: [] };
    if (respondendo) doc.pai = respondendo.id;
    await db.collection('tokcom').add(doc); cancelaResp();
    db.doc('tok/' + comVid.id).update({ coms: FV.increment(1) }).catch(() => {});
  } catch (e) { toast('nao deu pra comentar'); $('comTxt').value = texto; }
};
$('comSend').onclick = mandarCom;
$('cancResp').onclick = () => { cancelaResp(); $('comTxt').value = ''; };
$('comTxt').addEventListener('keydown', e => { if (e.key === 'Enter') mandarCom(); });
</script>
</body>
</html>
