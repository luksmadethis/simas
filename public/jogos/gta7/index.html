*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0c12;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;cursor:crosshair}
#titulo{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px;
  background:radial-gradient(ellipse at 50% 30%,#3a1450 0%,#0d0c12 70%);isolation:isolate;transition:opacity .5s}
#titulo .fundo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1;opacity:.45}
#titulo>*:not(.fundo){position:relative}
#titulo.some{opacity:0;pointer-events:none}
#titulo .logo{font:900 clamp(64px,16vw,170px)/0.9 Impact,"Arial Black",sans-serif;letter-spacing:-2px;
  background:linear-gradient(180deg,#fff 0%,#ffd23f 45%,#ff6ec7 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(6px 6px 0 #000) drop-shadow(0 0 30px rgba(255,110,199,.5));transform:rotate(-4deg)}
#titulo .sub{font:900 clamp(20px,4.5vw,42px) "Arial Black",sans-serif;color:#fff;text-shadow:3px 3px 0 #000;letter-spacing:4px;transform:rotate(-4deg);margin-top:-6px}
#titulo .selo{font:900 clamp(12px,2.4vw,18px) system-ui;background:#ff3d8b;color:#fff;padding:6px 14px;border:3px solid #000;box-shadow:4px 4px 0 #000;transform:rotate(-2deg);margin-top:4px}
#titulo .arco{height:8px;width:min(520px,80vw);border-radius:4px;background:linear-gradient(90deg,#e40303,#ff8c00,#ffed00,#008026,#004dff,#750787);margin:8px 0}
#titulo .tag{color:#bbb;font-size:15px;max-width:560px}
#titulo button{font:900 22px "Arial Black",sans-serif;padding:14px 34px;border-radius:14px;border:3px solid #000;background:#ffd23f;color:#111;cursor:pointer;box-shadow:5px 5px 0 #000;transition:transform .1s}
#titulo button:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 #000}
#titulo button.novo{background:#333;color:#fff;font-size:14px;padding:8px 18px;box-shadow:3px 3px 0 #000}
#titulo .volta{color:#ff8c00;font-weight:800;text-decoration:none;font-size:14px}
#topTitulo{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;max-width:620px;font:700 13px system-ui;color:#ddd}
#topTitulo b{width:100%;color:#ffd23f}
#topTitulo i{color:#7fd7ff;font-style:normal}
#dicas-ctrl{color:#888;font-size:12px;max-width:640px;line-height:1.5}
#menu{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);padding:12px}
#menu.aberto{display:flex}
#menu .caixa{background:#15121f;border:3px solid #ff6ec7;border-radius:18px;padding:18px;width:min(460px,100%);max-height:92vh;overflow:auto;box-shadow:8px 8px 0 #000}
#menu h2{font:900 22px "Arial Black",sans-serif;color:#ffd23f;margin-bottom:4px}
#menu .sub{color:#aaa;font-size:12px;margin-bottom:12px;line-height:1.5}
#menu .lista{display:flex;flex-direction:column;gap:7px}
#menu .item{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;padding:11px 13px;border-radius:10px;border:2px solid #2c2838;background:#1f1b2c;color:#fff;font-size:15px;cursor:pointer}
#menu .item:hover{background:#2a2540;border-color:#ff6ec7}
#menu .item b{color:#7CFC00;white-space:nowrap}
#menu .item.off{opacity:.4;cursor:default}
#menu .item.pobre{border-color:#e74c3c}
#menu .fechar{margin-top:12px;width:100%;padding:10px;border-radius:10px;border:0;background:#333;color:#fff;font-weight:700;cursor:pointer}
#toque{display:none;position:fixed;inset:0;z-index:30;pointer-events:none}
#toque.on{display:block}
#toque .jo{position:absolute;left:calc(22px + env(safe-area-inset-left));bottom:calc(22px + env(safe-area-inset-bottom));width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);pointer-events:auto}
#toque .bola{position:absolute;left:45px;top:45px;width:60px;height:60px;border-radius:50%;background:rgba(255,110,199,.55);border:2px solid #fff}

#toque button.ap{background:rgba(255,110,199,.6)}
#toque .b-tiro{right:calc(24px + env(safe-area-inset-right));bottom:calc(30px + env(safe-area-inset-bottom));width:86px;height:86px;font-size:34px;background:rgba(200,30,40,.5)}
#toque .b-carro{right:calc(122px + env(safe-area-inset-right));bottom:calc(24px + env(safe-area-inset-bottom));width:64px;height:64px}
#toque .b-freio{right:calc(28px + env(safe-area-inset-right));bottom:calc(130px + env(safe-area-inset-bottom));width:58px;height:58px;font-size:15px;font-weight:900}
#toque .b-arma{right:calc(110px + env(safe-area-inset-right));bottom:calc(104px + env(safe-area-inset-bottom));width:54px;height:54px;font-size:20px}
#toque .b-radio{right:calc(14px + env(safe-area-inset-right));top:calc(182px + env(safe-area-inset-top));width:44px;height:44px;font-size:18px}
#toque .b-mapa{right:calc(64px + env(safe-area-inset-right));top:calc(182px + env(safe-area-inset-top));width:44px;height:44px;font-size:18px}
#toque .b-hab{right:calc(314px + env(safe-area-inset-right));top:calc(182px + env(safe-area-inset-top));width:44px;height:44px;font-size:18px;border-color:#00e5ff!important}
#toque .b-nitro{right:calc(264px + env(safe-area-inset-right));top:calc(182px + env(safe-area-inset-top));width:44px;height:44px;font-size:18px}
#toque .b-rodas{right:calc(164px + env(safe-area-inset-right));top:calc(182px + env(safe-area-inset-top));width:44px;height:44px;font-size:18px}
#toque .b-pausa{right:calc(114px + env(safe-area-inset-right));top:calc(182px + env(safe-area-inset-top));width:44px;height:44px;font-size:16px}
#radio{position:fixed;right:16px;bottom:16px;z-index:35;width:212px;padding:0 6px 6px;border-radius:12px;background:#15121f;border:3px solid #a29bfe;box-shadow:5px 5px 0 #000;opacity:0;pointer-events:none;transform:translateY(20px);transition:opacity .3s,transform .3s}
#radio.on{opacity:1;pointer-events:auto;transform:none}
#radio .topo{font:900 12px "Arial Black",sans-serif;color:#c9b6ff;padding:6px 2px;display:flex;justify-content:space-between}
#radio .topo span{color:#777;font:700 10px system-ui}
#radio iframe{display:block;border-radius:6px}
body.titulo-on #radio{right:auto;left:50%;transform:translateX(-50%);bottom:12px}
#retry{display:none;position:fixed;left:50%;top:58%;transform:translateX(-50%);z-index:36;font:900 20px "Arial Black",sans-serif;padding:12px 26px;border-radius:12px;border:3px solid #000;background:#ff4d4d;color:#fff;box-shadow:5px 5px 0 #000;cursor:pointer}
@media (max-height:500px){#radio{right:auto;left:190px;bottom:8px}}
#menu .caixa{background:linear-gradient(#1a1626,#100d18);border:3px solid #ffd23f;border-radius:6px;padding:0;overflow:hidden}

#titulo button.online{background:#00e5ff;font-size:19px;padding:11px 28px}
#lobby{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(5,3,12,.92);padding:12px}
#lobby .caixa{background:#15121f;border:3px solid #00e5ff;border-radius:10px;padding:18px;width:min(560px,100%);max-height:94vh;overflow:auto;box-shadow:8px 8px 0 #000}
#lobby h2{font:900 26px "Arial Black",sans-serif;color:#00e5ff;margin-bottom:6px}
#lobby .sub{color:#aaa;font-size:13px;margin-bottom:12px}
#lobby label{display:block;font:900 12px system-ui;color:#ffd23f;margin:12px 0 6px;letter-spacing:1px;text-transform:uppercase}
#lobby input{width:100%;padding:11px;border-radius:8px;border:2px solid #333;background:#0d0b14;color:#fff;font:700 16px system-ui}
#lobby .skins{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
#lobby .skins button{background:#1f1b2c;border:3px solid #2c2838;border-radius:10px;padding:4px;color:#ccc;font:700 10px system-ui;cursor:pointer}
#lobby .skins button.on{border-color:#00e5ff;background:#123}
#lobby .skins img{width:100%;aspect-ratio:1;border-radius:50%;display:block}
#lobby .vai{margin-top:16px;width:100%;font:900 20px "Arial Black",sans-serif;padding:14px;border-radius:12px;border:3px solid #000;background:#00e5ff;color:#111;box-shadow:5px 5px 0 #000;cursor:pointer}
#lobby .volta{margin-top:8px;width:100%;padding:10px;border-radius:10px;border:0;background:#333;color:#fff;font-weight:700;cursor:pointer}
@media (max-width:520px){#lobby .skins{grid-template-columns:repeat(4,1fr)}}
#lobby .skins span{display:block;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lobby .ficha{display:flex;gap:12px;margin-top:14px;background:#0d0b14;border:2px solid #2c2838;border-radius:10px;padding:12px;align-items:flex-start}
#lobby .ficha img{width:86px;height:86px;border-radius:50%;border:3px solid #ffd23f;flex:none}

#lobby .ficha b{color:#ff6ec7;font-size:12px;text-transform:uppercase;letter-spacing:1px}
#lobby .ficha p{color:#ccc;font-size:13px;line-height:1.45;margin-top:6px}
#lobby .ficha .poder{color:#00e5ff;font-weight:800}
#chatOn{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:45;display:none;width:min(520px,92vw)}
#chatOn input{width:100%;padding:12px 14px;border-radius:12px;border:3px solid #00e5ff;background:rgba(10,8,20,.95);color:#fff;font:700 16px system-ui}
#toque .b-chat{right:calc(214px + env(safe-area-inset-right));top:calc(182px + env(safe-area-inset-top));width:44px;height:44px;font-size:18px}
#gire{display:none}

'use strict';
/* =========================================================
   GTA 7
   jogo de mundo aberto visto de cima (estilo GTA de PS1)
   ========================================================= */
const T = 64;                 // tamanho do bloquinho (tile) em pixels do mundo
const MW = 320, MH = 300;     // mapa em tiles (cidade em 0..191, Indonésia a leste, Serra ao sul)
const CIDADE = 192;
const GRID = 12;              // ruas a cada 12 tiles
const LAND0 = 6, LAND1 = MW - 7;

// ---------- utilidades ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const angDiff = (a, b) => { let d = b - a; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return d; };
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const rndi = (a, b) => Math.floor(rnd(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function seeded(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
const fmt$ = n => 'R$ ' + Math.floor(n).toLocaleString('pt-BR');

// ---------- entrada (teclado, mouse, toque) ----------
const KEY = {}, PRESS = {};
addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (!KEY[k]) PRESS[k] = true;
  KEY[k] = true;
  if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'tab'].includes(k)) e.preventDefault();
});
addEventListener('keyup', e => { KEY[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for (const k in KEY) KEY[k] = false; });
const MOUSE = { x: 0, y: 0, down: false, used: false };
const TOQUE = { ativo: false, jx: 0, jy: 0, atira: false, freio: false };
function apertou(...ks) { for (const k of ks) if (PRESS[k]) return true; return false; }
function segura(...ks) { for (const k of ks) if (KEY[k]) return true; return false; }

// ---------- áudio (efeitos + rádio gerados na hora) ----------
const SOM = {
  ctx: null, master: null, sfx: null, radioGain: null, motor: null, motorGain: null, sirene: null, sireneGain: null,
  init() {
    if (this.ctx) return;
    try {
      const C = window.AudioContext || window.webkitAudioContext; this.ctx = new C();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.8; this.master.connect(this.ctx.destination);

const tile = (x, y) => (x < 0 || y < 0 || x >= MW || y >= MH) ? TL.AGUA : mapa[y * MW + x];

function regiaoDoBloco(i, j) {

  skate: [4, 8], padaria: [5, 5], mercado: [8, 8], yori: [6, 1], nauj: [2, 13], baile: [13, 7],
  matheus: [9, 10], ltzin: [13, 13], armas: [6, 8], roupas: [7, 5], gelado: [9, 6], desmanche: [12, 12], poli: [8, 6], fatal: [6, 5], cafe: [11, 14], motors: [8, 4]

function addPredio(x0, y0, w, h, alt, cor, extra = {}) {
  for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) { setTile(x, y, TL.PREDIO); }

// ruas como segmentos entre cruzamentos (k = 1..15). Alguns somem pra formar quarteirões maiores.
const segH = {}, segV = {}, ponte = new Uint8Array(MW * MH), vagas = [];
const kH = (kx, ky) => kx + ',' + ky;
const temH = (kx, ky) => kx >= 1 && kx <= 14 && ky >= 1 && ky <= 15 && segH[kH(kx, ky)] !== false;
const temV = (kx, ky) => kx >= 1 && kx <= 15 && ky >= 1 && ky <= 14 && segV[kH(kx, ky)] !== false;

function conectado() {
  const vis = new Set(['1,1']), fila = [[1, 1]];

    const [x, y] = fila.pop();
    const viz = [];

    if (temV(x, y)) viz.push([x, y + 1]); if (temV(x, y - 1)) viz.push([x, y - 1]);
    for (const v of viz) { const k = v[0] + ',' + v[1]; if (!vis.has(k)) { vis.add(k); fila.push(v); } }
  }
  for (let y = 1; y <= 15; y++) for (let x = 1; x <= 15; x++) {
    const usado = temH(x, y) || temH(x - 1, y) || temV(x, y) || temV(x, y - 1);
    if (usado && !vis.has(x + ',' + y)) return false;

function decidirRuas(r) {
  const prot = new Set();
  const protBloco = (i, j) => { prot.add('H' + kH(i, j)); prot.add('H' + kH(i, j + 1)); prot.add('V' + kH(i, j)); prot.add('V' + kH(i + 1, j)); };

  for (const [i, j] of [[4, 8], [6, 8], [8, 5], [6, 4], [1, 13], [4, 11], [5, 4], [9, 8], [6, 10]]) prot.add('H' + kH(i, j));

  for (let ky = 1; ky <= 14; ky++) for (let kx = 2; kx <= 14; kx++) cands.push(['V', kx, ky]);
  for (const [t, kx, ky] of cands) {

function gerarMapa() {
  const r = seeded(7777);

  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {

function estrada(pts, larg = 1.3) { // pinta estrada curva passando pelos pontos (em tiles)

// ---------- Serra do Simas: morro ao sul, estrada cheia de curva ----------
function gerarSerra(r) {
  for (let y = CIDADE; y < 238; y++) for (let x = 14; x < 180; x++) {
    const topo = 196 + ruido(x, 31) * 5, fundo = 236 - ruido(x, 37) * 5, esq = 18 + ruido(y, 41) * 6, dir = 176 - ruido(y, 43) * 6;
    if (y > topo && y < fundo && x > esq && x < dir) setTile(x, y, ruido(x * 1.7 + y, 7) > 0.62 ? TL.TERRA : TL.GRAMA);
  }
  // duas ligações com a cidade (continuação das ruas verticais 7 e 3)
  for (const kx of [3, 7]) for (let y = 180; y < 204; y++) for (const x of [GRID * kx, GRID * kx + 1]) { if (tile(x, y) === TL.AGUA) ponte[y * MW + x] = 1; setTile(x, y, TL.RUA); }
  // estrada sinuosa de ponta a ponta + subida pro mirante
  estrada(curva(t => [t, 214 + Math.sin(t * 0.09) * 9 + Math.sin(t * 0.031) * 4], 26, 168, 0.5));
  estrada([[GRID * 3 + 1, 203], [GRID * 3 + 1, 205], [37, 214 + Math.sin(37 * 0.09) * 9 + Math.sin(37 * 0.031) * 4]]);
  estrada([[GRID * 7 + 1, 203], [GRID * 7 + 1, 206], [85, 214 + Math.sin(85 * 0.09) * 9 + Math.sin(85 * 0.031) * 4]]);
  estrada(curva(t => [120 + Math.sin(t * 0.7) * 8, t], 214, 232, 0.4));
  LUGAR.mirante = { x: 120 * T, y: 232 * T, nome: 'Mirante da Serra' };
  for (let y = 230; y < 236; y++) for (let x = 115; x < 126; x++) if (tile(x, y) !== TL.AGUA) setTile(x, y, TL.PRACA);
  for (let k = 0; k < 260; k++) { const x = 16 + r() * 162, y = 196 + r() * 42, t = tile(x | 0, y | 0); if (t === TL.GRAMA || t === TL.TERRA) deco.push({ t: r() < 0.75 ? 'arvore' : 'pedra', x: x * T, y: y * T, s: 0.9 + r() * 0.7 }); }
}
// ---------- Litoral Sul: faixa de praia nova, rodovia cheia de curva, autódromo e farol ----------
function gerarLitoral(r) {
  const yTopo = x => 247 + ruido(x, 51) * 5, yFundo = x => 289 - ruido(x, 57) * 5;
  for (let y = 240; y < MH - 2; y++) for (let x = 16; x < MW - 6; x++) {
    const esq = 18 + ruido(y, 61) * 5, dir = MW - 10 - ruido(y, 63) * 6;
    if (y > yTopo(x) && y < yFundo(x) && x > esq && x < dir) setTile(x, y, y > yFundo(x) - 7 ? TL.AREIA : (ruido(x * 1.3 + y, 9) > 0.66 ? TL.TERRA : TL.GRAMA));
  }
  // rodovia da orla, de ponta a ponta, toda serpenteando
  const orla = t => [t, 266 + Math.sin(t * 0.045) * 7 + Math.sin(t * 0.13) * 2.5];
  estrada(curva(orla, 24, MW - 14, 0.4), 1.5);
  // ligações: da Serra (descendo o morro), do mirante e da ponta sul da Indonésia (ponte comprida)
  estrada(curva(t => [168 + Math.sin(t * 0.25) * 6, t], 214 + Math.sin(168 * 0.09) * 9, 262, 0.4), 1.4);
  estrada(curva(t => [120 + Math.sin(t * 0.4) * 5, t], 232, 266, 0.4), 1.3);
  estrada(curva(t => [222 + Math.sin(t * 0.12) * 10, t], 186, 266, 0.4), 1.4);
  // autódromo Simas: circuito fechado cheio de curva
  const pista = t => [62 + Math.cos(t) * 30 + Math.sin(t * 2) * 5, 274 + Math.sin(t) * 9 + Math.cos(t * 3) * 2];
  for (let y = 260; y < 288; y++) for (let x = 28; x < 98; x++) if (tile(x, y) === TL.GRAMA || tile(x, y) === TL.TERRA) setTile(x, y, TL.GRAMA);
  estrada(curva(pista, 0, Math.PI * 2 + 0.05, 0.03), 1.7);
  LUGAR.autodromo = { x: pista(0)[0] * T, y: pista(0)[1] * T, nome: 'Autódromo Simas' };
  LUGAR.pistaPts = []; for (let k = 1; k <= 10; k++) { const p = pista(k / 10 * Math.PI * 2); LUGAR.pistaPts.push({ x: p[0] * T, y: p[1] * T }); }
  addPredio(56, 262, 12, 3, 0.35, '#c0392b', { teto: '#7b241c', placa: 'AUTÓDROMO SIMAS', neon: '#ff6ec7' });
  // farol na ponta leste
  const fx = MW - 22, fy = 272;
  addPredio(fx, fy, 4, 4, 1.4, '#ecf0f1', { teto: '#c0392b', placa: 'FAROL', neon: '#ffe600' });
  LUGAR.farol = { x: (fx + 2) * T, y: (fy + 5.5) * T, nome: 'Farol do Simas' };
  // vila de pescador, quiosques e casinhas de praia
  for (let k = 0; k < 26; k++) { const x = 100 + Math.floor(r() * (MW - 130)), y = 250 + Math.floor(r() * 30); if (retLivre(x, y, 3, 3) && Math.abs(y - orla(x)[1]) > 4) addPredio(x, y, 3, 3, 0.25 + r() * 0.3, pick(['#c8a165', '#5dade2', '#f5b7b1', '#a3e4d7', '#f9e79f']), { teto: pick(['#5d4037', '#c0392b', '#2471a3']), palha: r() < 0.5 }); }
  for (let k = 0; k < 10; k++) { const x = 30 + Math.floor(r() * (MW - 50)); for (let y = 280; y < 292; y++) if (tile(x, y) === TL.AREIA && tile(x, y + 3) === TL.AREIA && retLivre(x, y, 2, 2)) { addPredio(x, y, 2, 2, 0.2, '#f5cba7', { teto: '#e74c3c', palha: true, placa: k % 2 ? 'COCO' : 'QUIOSQUE' }); break; } }
  LUGAR.litoral = { x: 200 * T, y: orla(200)[1] * T };
  for (let k = 0; k < 220; k++) { const x = 20 + r() * (MW - 30), y = 246 + r() * 46, t = tile(x | 0, y | 0); if (t === TL.AREIA) deco.push({ t: 'palmeira', x: x * T, y: y * T, s: 1 }); else if (t === TL.GRAMA && r() < 0.5) deco.push({ t: r() < 0.8 ? 'arvore' : 'pedra', x: x * T, y: y * T, s: 0.9 + r() * 0.5 }); }
}
// ---------- orla do Rio: avenida curva na beira da praia (oeste) ----------
function orlaDoRio(r) {
  const xo = y => 3 + ruido(y, 1) * 7 + 2.6;
  estrada(curva(t => [xo(t), t], 112, 186, 0.4), 1.3);

// ---------- poste, hidrante, lixeira e placa nas calçadas (tudo dá pra derrubar de carro) ----------
function mobiliaUrbana(r) {
  for (let y = 0; y < CIDADE; y++) for (let x = 0; x < CIDADE; x++) {
    if (tile(x, y) !== TL.CALCADA) continue;
    const h = ((x * 92821) ^ (y * 68917)) >>> 0, reg = regiaoTile[y * MW + x];
    let lado = null;
    if (ehRua(x, y + 1)) lado = [0.5, 0.85]; else if (ehRua(x, y - 1)) lado = [0.5, 0.15]; else if (ehRua(x + 1, y)) lado = [0.85, 0.5]; else if (ehRua(x - 1, y)) lado = [0.15, 0.5];
    if (!lado) continue;
    const px = (x + lado[0]) * T, py = (y + lado[1]) * T;
    if ((x + y) % 5 === 0 && h % 3 === 0) deco.push({ t: 'poste', x: px, y: py, a: Math.atan2(lado[1] - 0.5, lado[0] - 0.5) });
    else if (h % 29 === 0) deco.push({ t: 'hidrante', x: px, y: py });
    else if (h % 23 === 0) deco.push({ t: 'lixeira', x: px, y: py });
    else if (h % 41 === 0 && reg === REG.CENTRO) deco.push({ t: 'placa', x: px, y: py, txt: pick(['PARE', 'BH →', 'RECIFE →', 'PROIBIDO VAGABUNDAGEM', 'DEVAGAR', 'CUIDADO: IDOSAS AO TELEFONE']) });
    else if (h % 13 === 0 && reg === REG.CENTRO) deco.push({ t: 'arvore', x: px, y: py, s: 0.6 });
  }
}

const DCEL = 4 * T, DGRADE = new Map();
const COLIDE = { arvore: { r: 13, solido: true }, pedra: { r: 24, solido: true }, palmeira: { r: 9, quebra: 330 }, poste: { r: 6, quebra: 70 }, hidrante: { r: 8, quebra: 50 },

function indexarDeco() {
  DGRADE.clear();
  for (const d of deco) { const k = Math.floor(d.x / DCEL) + ',' + Math.floor(d.y / DCEL); let l = DGRADE.get(k); if (!l) DGRADE.set(k, l = []); l.push(d); }
}
function decoNaArea(x0, y0, x1, y1, fn) {
  for (let cy = Math.floor(y0 / DCEL); cy <= Math.floor(y1 / DCEL); cy++) for (let cx = Math.floor(x0 / DCEL); cx <= Math.floor(x1 / DCEL); cx++) { const l = DGRADE.get(cx + ',' + cy); if (l) for (const d of l) fn(d); }
}

function gerarMini() {
  MINI = document.createElement('canvas'); MINI.width = MW; MINI.height = MH;
  const c = MINI.getContext('2d'), img = c.createImageData(MW, MH);
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    const hex = COR_MINI[tile(x, y)] || '#000', v = parseInt(hex.slice(1), 16), o = (y * MW + x) * 4;
    img.data[o] = v >> 16; img.data[o + 1] = (v >> 8) & 255; img.data[o + 2] = v & 255; img.data[o + 3] = 255;
  }
  c.putImageData(img, 0, 0);
}

// faixas (pistas) pra trânsito: mão direita
// direção: 0 = leste, 1 = sul, 2 = oeste, 3 = norte
const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]];
function centroFaixa(dir, eixo) {
  // eixo = índice da rua (k): rua vertical em x = 12k, 12k+1 ; horizontal em y = 12k, 12k+1
  if (dir === 1) return (GRID * eixo + 0.5) * T;      // descendo: coluna da esquerda (x=12k)
  if (dir === 3) return (GRID * eixo + 1.5) * T;      // subindo: coluna da direita
  if (dir === 0) return (GRID * eixo + 1.5) * T;      // pra leste: linha de baixo
  return (GRID * eixo + 0.5) * T;                     // pra oeste: linha de cima
}

// ---------- física dos carros ----------
function cantosCarro(c, folga = 0) {

function fisicaCarro(c, dt, acel, freio, vira, freioMao) {

  if (acel) vFrente += t.acel * (1 + c.motor * 0.15) * dt;

  if (!acel && !freio) vFrente *= Math.pow(0.55, dt);
  if (c.nitroOn) vFrente += t.acel * 1.4 * dt;

function iaInimigo(p, dt) {

function aplicarPersonagem(id, novo) {

function aplicarPersonagemOnline(id) {

function telaPersonagens(aoEscolher) {

function anguloMira() {

function balaHab(x, y, ang, vel, dano, vida) { const j = W.jog, bl = { x, y, vx: Math.cos(ang) * vel, vy: Math.sin(ang) * vel, vida, dano, dono: j }; W.balas.push(bl); ONLINE.tiro(bl); }
function usarHabilidade() {

    case 'cas': j.hp = 100; j.colete = 100; if (j.carro) j.carro.hp = Math.max(j.carro.hp, j.carro.hpMax * 0.5); W.efeitos.push({ t: 'texto', x: j.x, y: j.y - 40, txt: '😴 zzz... recarregado', vida: 1.8, max: 1.8, cor: '#9fe' }); break;
    case 'alan': if (j.carro) { ok = false; break; } j.rodaAtiva = 'skate'; j.turbo = 6; j.turboMult = 1.7; j.atropela = 6; break;
    case 'yori': { const a = j.a + Math.PI / 2; let x = al.x + Math.cos(a) * 70, y = al.y + Math.sin(a) * 70; if (solidoEm(x, y)) { x = al.x - Math.cos(a) * 70; y = al.y - Math.sin(a) * 70; } if (solidoEm(x, y)) { ok = false; break; } const c = novoCarro('pickup', x, y, j.a, { cor: '#f1c40f', doJogador: true, motor: 2, blind: 1 }); c.nome = 'Hilux do Yori'; W.carros.push(c); W.efeitos.push({ t: 'fumaca', x, y, r: 30, vida: 0.6, max: 0.6 }); falar('yori', 'chegou a Hilux, sô. tem manga na caçamba', 2.5); break; }

    case 'gelado': if (j.carro) { ok = false; break; } j.galinha = true; j.galinhaT = 10; W.procurado = 0; W.calor = 0; W.efeitos.push({ t: 'fumaca', x: j.x, y: j.y, r: 30, vida: 0.6, max: 0.6 }); falar('gelado', 'pó pó pó... polícia? que polícia?', 2.5); break;

    case 'poli': SOM.buzina('caminhao'); SOM.buzina('corneta'); for (let k = 0; k < 3; k++) W.efeitos.push({ t: 'onda', x: al.x, y: al.y, vida: 0.6 + k * 0.25, max: 0.6 + k * 0.25 }); for (const p of W.peds) if (!p.morto && dist(p.x, p.y, al.x, al.y) < 420) { p.medo = 6; p.perigoX = al.x; p.perigoY = al.y; if (p.hostil && dist(p.x, p.y, al.x, al.y) < 220) feriPed(p, 25, j); } for (const c of W.carros) if (c !== j.carro && c.ia && dist(c.x, c.y, al.x, al.y) < 420) { c.vel *= 0.1; c.vx *= 0.1; c.vy *= 0.1; } for (let k = 0; k < 10; k++) { const a = k / 10 * Math.PI * 2; balaHab(al.x, al.y, a, 500, 12, 0.35); } break;

function atualizaHabilidade(dt) {
  const j = W.jog;
  if (j.habCd > 0) j.habCd -= dt;
  if (j.turbo > 0) { j.turbo -= dt; if (j.turbo <= 0) { j.turboMult = 1; j.atropela = 0; } }
  if (j.galinhaT > 0) { j.galinhaT -= dt; W.procurado = 0; W.calor = 0; if (j.galinhaT <= 0) { j.galinha = false; W.efeitos.push({ t: 'fumaca', x: j.x, y: j.y, r: 30, vida: 0.6, max: 0.6 }); } }

  if (j.atropela > 0 && !j.carro) for (const p of W.peds) if (!p.morto && dist(p.x, p.y, j.x, j.y) < 22) feriPed(p, 30, j);

function hudHabilidade(g, x, y, peq) {
