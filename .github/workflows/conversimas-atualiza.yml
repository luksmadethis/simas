name: atualizar ConverSimas
# toda segunda o Render reconstrói o ConverSimas com o yt-dlp mais novo (os sites mudam toda hora)
on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date +%F > conversimas/versao.txt
          git config user.name "ConverSimas bot"
          git config user.email "luksmadethis@users.noreply.github.com"
          git commit -am "ConverSimas: atualiza yt-dlp" && git push || echo nada
