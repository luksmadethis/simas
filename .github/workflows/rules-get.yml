name: ler regras firestore
on: workflow_dispatch
jobs:
  ler:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: |
          T=$(gcloud auth print-access-token)
          R=$(curl -s -H "Authorization: Bearer $T" https://firebaserules.googleapis.com/v1/projects/simasfitness2/releases/cloud.firestore)
          echo "$R"
          N=$(echo "$R" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("rulesetName",""))')
          [ -n "$N" ] && curl -s -H "Authorization: Bearer $T" https://firebaserules.googleapis.com/v1/$N | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d.get("source",{}).get("files",[{}])[0].get("content",d))'
